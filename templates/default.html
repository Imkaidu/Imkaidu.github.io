<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="$if(lang)$$lang$$else$en$endif$" xml:lang="$if(lang)$$lang$$else$en$endif$">
<head>
  <meta charset="utf-8" />
  <meta name="generator" content="pandoc" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
  <title>$if(title-prefix)$$title-prefix$ – $endif$$pagetitle$</title>
$if(description)$
  <meta name="description" content="$description$" />
$endif$

  <!-- Link previews. Set `description:` in a page's front matter to fill these.
       Open Graph requires absolute URLs, so this is the one place the
       prefer-relative-links rule in AGENTS.md cannot apply. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Kai Du" />
  <meta property="og:title" content="$pagetitle$" />
$if(description)$
  <meta property="og:description" content="$description$" />
$endif$
  <meta property="og:image" content="https://imkaidu.net/photo.jpg" />
  <meta name="twitter:card" content="summary" />

  <style>
    code{white-space: pre-wrap;}
    span.smallcaps{font-variant: small-caps;}
    span.underline{text-decoration: underline;}
    div.column{display: inline-block; vertical-align: top; width: 50%;}
    div.hanging-indent{margin-left: 1.5em; text-indent: -1.5em;}
    ul.task-list{list-style: none;}
  </style>
  <!-- Fonts are requested here rather than via @import in custom.css: an
       @import is only discovered after custom.css has been fetched and parsed,
       which delays the font request by two round trips. Both families are
       combined into one request. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,400;0,700;1,400;1,700&amp;family=Roboto+Mono:wght@400;700&amp;display=swap" />
  <link rel="stylesheet" href="/css/custom.css" />

$endif$

$endfor$
</head>
